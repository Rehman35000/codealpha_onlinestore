<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ====== shared navbar (built by js/layout.js) ====== -->
  <div id="site-header"></div>

  <!-- ====== login form ====== -->
  <main class="container auth-page" id="main" tabindex="-1">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="muted">Welcome back! Enter your details to continue.</p>

      <div id="message"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
      </form>

      <p class="muted center">Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </main>

  <!-- ====== footer (built by js/layout.js) ====== -->
  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
