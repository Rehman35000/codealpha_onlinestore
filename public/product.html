<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product details — ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ====== shared navbar (built by js/layout.js) ====== -->
  <div id="site-header"></div>

  <!-- ====== product details (filled in by js/product.js) ====== -->
  <main class="container" id="main" tabindex="-1">
    <div id="message"></div>
    <div id="productDetail" class="detail-layout"></div>
    <div class="product-preview" id="productPreview" hidden>
      <p>Not available</p>
    </div>
  </main>

  <!-- ====== footer (built by js/layout.js) ====== -->
  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
